[package]
name = "nova"
version = "2.4.40-alpha"
description = "NOVA Download Manager"
authors = ["NOVA"]
license = "MIT"
repository = "https://github.com/nova-download-manager/nova"
edition = "2021"
rust-version = "1.77"

[lib]
name = "nova_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nova-core-model = { path = "../crates/nova-core-model" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
flexi_logger = "0.31"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["rt", "macros", "time", "net", "sync", "io-util", "signal"] }
axum = { version = "0.8", features = ["macros", "query"] }
tower-http = { version = "0.7", features = ["cors", "fs", "compression-gzip", "limit"] }
reqwest = { version = ">=0.12.0, <0.14", features = ["json", "blocking", "multipart", "stream", "gzip", "brotli", "deflate"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
async-stream = "0.3"
futures-core = "0.3"
curl = { version = "0.4", default-features = false, features = ["ssl", "http2", "protocol-ftp", "ntlm"] }
curl-sys = { version = "0.4", default-features = false, features = ["ssl", "http2", "protocol-ftp"] }
regex = "1"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
# Persists sensitive settings in the platform credential store instead of JSON.
# Features are explicit because keyring enables no credential store by default.
keyring = { version = "3.6.2", default-features = false, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust", "vendored"] }
zip = "8.6.0"
tar = "0.4"
xz2 = "0.1"
unicode-normalization = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
# Used only by tests to generate a real gzip stream for the
# Content-Encoding regression tests (libcurl decompresses it transparently,
# exercising the "disk bytes > declared Content-Length" progress path).
flate2 = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = 3
panic = "unwind"
debug = false
incremental = false
overflow-checks = true

[profile.release.package."*"]
opt-level = 3

[profile.release.build-override]
opt-level = 3
debug = false

