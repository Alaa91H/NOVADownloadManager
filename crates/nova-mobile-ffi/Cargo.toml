[package]
name = "nova-mobile-ffi"
version = "2.4.25-alpha"
description = "Typed Rust-to-Kotlin bridge for NOVA mobile clients"
authors = ["NOVA"]
license = "MIT"
repository = "https://github.com/Alaa91H/NOVADownloadManager"
edition = "2021"
rust-version = "1.77"

[lib]
name = "nova_mobile_ffi"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
nova-core-model = { path = "../nova-core-model" }
nova-download-core = { path = "../nova-download-core", features = ["http2", "rustls", "static-curl"] }
nova-mobile-core = { path = "../nova-mobile-core", features = ["http2", "rustls", "static-curl"] }
thiserror = "2"
uniffi = "0.32.0"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
