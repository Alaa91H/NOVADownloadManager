[package]
name = "nova-mobile-core"
version = "2.4.48-alpha"
description = "Android-safe mobile facade over the shared NOVA download core"
authors = ["NOVA"]
license = "MIT"
repository = "https://github.com/Alaa91H/NOVADownloadManager"
edition = "2021"
rust-version = "1.85"

[features]
default = []
http2 = ["nova-download-core/http2"]
rustls = ["nova-download-core/rustls"]
static-curl = ["nova-download-core/static-curl"]

[dependencies]
nova-download-core = { path = "../nova-download-core" }
nova-media-core = { path = "../nova-media-core" }
nova-media-processing-core = { path = "../nova-media-processing-core" }
thiserror = "2"
