[package]
name = "nova-download-core"
version = "2.4.48-alpha"
description = "Platform-neutral NOVA download transport and transfer planning core"
authors = ["NOVA"]
license = "MIT"
repository = "https://github.com/Alaa91H/NOVADownloadManager"
edition = "2021"
rust-version = "1.77"

[features]
default = []
http2 = ["curl/http2"]
rustls = ["curl/rustls"]
static-curl = ["curl/static-curl"]

[dependencies]
curl = { version = "0.4.50", default-features = false }
nova-core-model = { path = "../nova-core-model" }
thiserror = "2"
