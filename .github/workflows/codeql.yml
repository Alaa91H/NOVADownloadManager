---
name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none
          - language: java-kotlin
            build-mode: manual

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK command-line tools
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@v4

      - name: Install Android compile dependencies
        if: matrix.language == 'java-kotlin'
        run: |
          # sdkmanager closes stdin after accepting its prompts. Ignore the
          # expected SIGPIPE from `yes`, but keep sdkmanager failures fatal.
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager_exit=${PIPESTATUS[1]}
          set -o pipefail
          test "$sdkmanager_exit" -eq 0
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-37.0' \
            'build-tools;36.0.0'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          dependency-caching: true

      - name: Build Kotlin for CodeQL
        if: matrix.language == 'java-kotlin'
        working-directory: android
        # CodeQL must observe a real Kotlin compiler process. A cached task
        # produces no traceable compilation and leaves the Java/Kotlin database empty.
        run: ./gradlew --no-daemon --no-build-cache --rerun-tasks :app:compileDebugKotlin

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
