name: Native UI

on:
  push:
    branches:
      - "feature/qt6-native-desktop-ui"
    paths:
      - "desktop-native/**"
      - "src/**"
      - "src-tauri/**"
      - "docs/NATIVE_UI_MIGRATION.md"
      - ".github/workflows/native-ui.yml"
  pull_request:
    paths:
      - "desktop-native/**"
      - "src/**"
      - "src-tauri/**"
      - "docs/NATIVE_UI_MIGRATION.md"
      - ".github/workflows/native-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build native UI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            arch: x64
          - os: windows-11-arm
            platform: Windows
            arch: arm64
          - os: ubuntu-latest
            platform: Linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: Linux
            arch: arm64
          - os: macos-15
            platform: macOS
            arch: arm64
          - os: macos-15-intel
            platform: macOS
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust backend build dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash scripts/install-linux-build-deps.sh \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            libbrotli-dev \
            libzstd-dev \
            libnghttp2-dev \
            libssh2-1-dev \
            pkg-config

      - name: Build native Rust runtime
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --bin nova-native-backend --bin nova-native-host

      - name: Check localization gate
        run: node desktop-native/scripts/check-localization.mjs

      - name: Check Stage 6 parity
        run: node desktop-native/scripts/check-parity.mjs

      - name: Install Qt
        if: matrix.arch == 'x64' || runner.os == 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true

      - name: Install Qt (Linux ARM64)
        if: runner.os == 'Linux' && matrix.arch == 'arm64'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux_arm64
          arch: linux_gcc_arm64
          cache: true

      - name: Install Qt (Windows ARM64)
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows_arm64
          arch: win64_msvc2022_arm64
          cache: true

      - name: Configure
        if: runner.os != 'Windows' || matrix.arch != 'arm64'
        run: cmake -S desktop-native -B build/native -DCMAKE_BUILD_TYPE=Release -DNOVA_BUILD_TESTS=ON

      - name: Configure (Windows ARM64)
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        run: cmake -S desktop-native -B build/native -A ARM64 -DCMAKE_BUILD_TYPE=Release -DNOVA_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/native --config Release --parallel
      - name: Validate native architecture (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Get-PEMachine([string]$Path) {
            $bytes = [System.IO.File]::ReadAllBytes($Path)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            return [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          }
          $expected = if ("${{ matrix.arch }}" -eq "arm64") { 0xAA64 } else { 0x8664 }
          foreach ($binary in @(
            "build/native/Release/nova-native.exe",
            "src-tauri/target/release/nova-native-backend.exe",
            "src-tauri/target/release/nova-native-host.exe"
          )) {
            $actual = Get-PEMachine $binary
            if ($actual -ne $expected) { throw "$binary machine 0x$($actual.ToString('X4')) does not match expected ${{ matrix.arch }}" }
          }

      - name: Validate native architecture (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ matrix.arch }}'
          for binary in build/native/nova-native src-tauri/target/release/nova-native-backend src-tauri/target/release/nova-native-host; do
            description="$(file -b "$binary")"
            if [ "$expected" = "arm64" ]; then
              printf '%s' "$description" | grep -Eqi 'aarch64|ARM aarch64'
            else
              printf '%s' "$description" | grep -Eqi 'x86-64|x86_64'
            fi
          done

      - name: Validate native architecture (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ matrix.arch }}'
          app="$(find build/native -type d -name 'nova-native.app' -print -quit)"
          test -n "$app"
          qt_archs="$(lipo -archs "$app/Contents/MacOS/nova-native")"
          backend_archs="$(lipo -archs src-tauri/target/release/nova-native-backend)"
          host_archs="$(lipo -archs src-tauri/target/release/nova-native-host)"
          if [ "$expected" = "arm64" ]; then
            for archs in "$qt_archs" "$backend_archs" "$host_archs"; do printf '%s' "$archs" | grep -qw arm64; done
          else
            for archs in "$qt_archs" "$backend_archs" "$host_archs"; do printf '%s' "$archs" | grep -qw x86_64; done
          fi

      - name: Deploy Qt test runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          windeployqt --release --no-translations "build/native/Release/nova-native-tests.exe"

      - name: Native stress and recovery tests
        run: ctest --test-dir build/native -C Release --output-on-failure

      - name: Install preview bundle
        run: cmake --install build/native --config Release --prefix "preview/NOVA-Native-${{ runner.os }}"

      - name: Add Rust runtime to preview (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = "preview/NOVA-Native-Windows/bin"
          Copy-Item "src-tauri/target/release/nova-native-backend.exe" $bundle
          Copy-Item "src-tauri/target/release/nova-native-host.exe" $bundle
          if (!(Test-Path (Join-Path $bundle "nova-native-backend.exe"))) { throw "Native backend missing" }
          if (!(Test-Path (Join-Path $bundle "nova-native-host.exe"))) { throw "Native host missing" }

      - name: Add Rust runtime to preview (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bundle="preview/NOVA-Native-Linux/bin"
          cp src-tauri/target/release/nova-native-backend "$bundle/"
          cp src-tauri/target/release/nova-native-host "$bundle/"
          chmod 0755 "$bundle/nova-native-backend" "$bundle/nova-native-host"
          test -x "$bundle/nova-native-backend"
          test -x "$bundle/nova-native-host"

      - name: Prepare macOS native bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bundle="preview/NOVA-Native-macOS"
          app="$(find "$bundle" -type d -name '*.app' -print -quit)"
          test -n "$app"
          macos_bin="$app/Contents/MacOS"
          test -x "$macos_bin/nova-native"
          cp src-tauri/target/release/nova-native-backend "$macos_bin/"
          cp src-tauri/target/release/nova-native-host "$macos_bin/"
          chmod 0755 "$macos_bin/nova-native-backend" "$macos_bin/nova-native-host"
          macdeployqt "$app" -qmldir=desktop-native/qml
          test -x "$macos_bin/nova-native-backend"
          test -x "$macos_bin/nova-native-host"

      - name: Deploy Qt runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = "preview/NOVA-Native-Windows"
          $exe = Join-Path $bundle "bin/nova-native.exe"
          windeployqt --release --qmldir desktop-native/qml --dir (Join-Path $bundle "bin") $exe
          Copy-Item build/native-parity-report.md (Join-Path $bundle "PARITY_REPORT.md")
          @"
          NOVA Native Preview
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
          Platform: Windows
          Architecture: ${{ matrix.arch }}
          Qt: 6.8.3
          Stage: 6 parity freeze
          Runtime: Qt UI + Rust backend + Native Messaging host
          "@ | Set-Content (Join-Path $bundle "BUILD_INFO.txt")

      - name: Prepare macOS preview metadata
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bundle="preview/NOVA-Native-macOS"
          cp build/native-parity-report.md "$bundle/PARITY_REPORT.md"
          {
            echo "NOVA Native Preview"
            echo "Commit: ${GITHUB_SHA}"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Platform: macOS"
            echo "Architecture: ${{ matrix.arch }}"
            echo "Qt: 6.8.3"
            echo "Stage: 6 parity freeze"
            echo "Runtime: Qt UI + Rust backend + Native Messaging host"
          } > "$bundle/BUILD_INFO.txt"

      - name: Smoke-test native backend auto-pair (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          runtime="preview/NOVA-Native-Linux/bin"
          data_dir="$RUNNER_TEMP/nova-native-backend-smoke"
          mkdir -p "$data_dir"
          NOVA_NATIVE_DATA_DIR="$data_dir" NOVA_DAEMON_PORT=3299 "$runtime/nova-native-backend" &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 40); do
            response="$(curl -fsS -X POST \
              -H 'Content-Type: application/json' \
              -H 'x-nova-native-desktop: 1' \
              -d '{}' \
              http://127.0.0.1:3299/v1/pair/auto 2>/dev/null || true)"
            if printf '%s' "$response" | grep -q '"pairToken"'; then
              ready=1
              break
            fi
            sleep 0.25
          done
          test "$ready" -eq 1

      - name: Prepare Linux preview metadata
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bundle="preview/NOVA-Native-Linux"
          cp build/native-parity-report.md "$bundle/PARITY_REPORT.md"
          {
            echo "NOVA Native Preview"
            echo "Commit: ${GITHUB_SHA}"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Platform: Linux"
            echo "Architecture: ${{ matrix.arch }}"
            echo "Qt: 6.8.3"
            echo "Stage: 6 parity freeze"
            echo "Runtime: Qt UI + Rust backend + Native Messaging host"
          } > "$bundle/BUILD_INFO.txt"
          ldd "$bundle/bin/nova-native" > "$bundle/LINUX_RUNTIME_DEPENDENCIES.txt" || true

      - name: Upload native preview
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Native-Preview-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: preview/NOVA-Native-${{ runner.os }}/
          if-no-files-found: error
          retention-days: 14
