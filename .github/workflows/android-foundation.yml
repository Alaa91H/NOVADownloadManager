---
name: Android foundation

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: android-foundation-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  foundation:
    name: Build Android foundation and ARM64 bridge
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4

      - name: Install Android build dependencies
        run: |
          # sdkmanager closes stdin after accepting its prompts. Ignore the
          # expected SIGPIPE from `yes`, but keep sdkmanager failures fatal.
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager_exit=${PIPESTATUS[1]}
          set -o pipefail
          test "$sdkmanager_exit" -eq 0
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-37.0' \
            'build-tools;36.0.0' \
            'ndk;28.2.13676358' \
            'cmake;3.22.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK and run JVM tests
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest

      - name: Set up Rust with Android ARM64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/nova-mobile-ffi -> .build/android-rust
          key: android-arm64

      - name: Verify ARM64 Rust bridge link
        run: |
          scripts/build-android-ffi.sh arm64-v8a
          test -f android/app/src/main/jniLibs/arm64-v8a/libnova_mobile_ffi.so

      - name: Upload Android foundation outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-foundation-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
