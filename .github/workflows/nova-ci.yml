name: NOVA Unified CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  changes:
    name: Detect affected build areas
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      runtime: ${{ steps.filter.outputs.runtime }}
      windows_installer: ${{ steps.filter.outputs.windows_installer }}
      build_reset: ${{ steps.filter.outputs.build_reset }}
      release_request: ${{ steps.filter.outputs.release_request }}

    steps:
      - name: Harden runner
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) || github.event_name == 'pull_request'
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) || github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed areas
        id: filter
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) || github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            desktop:
              - 'desktop-native/**'
              - 'src-tauri/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'scripts/**'
              - 'browser-extension/**'
              - 'docs/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'packaging/windows/**'
              - '.github/workflows/nova-ci.yml'
            windows_installer:
              - 'desktop-native/**'
              - 'src-tauri/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'scripts/**'
              - 'browser-extension/**'
              - 'docs/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'packaging/windows/**'
              - '.github/release-request.json'
              - '.github/workflows/nova-ci.yml'
            runtime:
              - 'src-tauri/**'
              - 'desktop-native/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'scripts/**'
              - 'browser-extension/**'
              - '.github/workflows/nova-ci.yml'
            build_reset:
              - '.github/build-reset.json'
            release_request:
              - '.github/release-request.json'

  reset:
    name: Cancel stale runs and start clean CI
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.build_reset == 'true'
    permissions:
      actions: write
      contents: read
    concurrency:
      group: repository-build-reset
      cancel-in-progress: true
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Cancel every other active workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          cancelled=0
          for status in queued in_progress pending waiting requested; do
            while IFS= read -r run_id; do
              [ -n "$run_id" ] || continue
              [ "$run_id" = "$CURRENT_RUN_ID" ] && continue

              echo "Cancelling $status workflow run $run_id"
              gh api \
                --method POST \
                -H "Accept: application/vnd.github+json" \
                "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" \
                >/dev/null 2>&1 || true
              cancelled=$((cancelled + 1))
            done < <(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/$GITHUB_REPOSITORY/actions/runs?status=$status&per_page=100" \
                --jq '.workflow_runs[].id'
            )
          done

          echo "Requested cancellation for $cancelled stale workflow run(s)."
          echo "cancelled=$cancelled" >> "$GITHUB_OUTPUT"

      - name: Start clean unified validation on main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run nova-ci.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Summary
        run: |
          echo "## Build reset complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- All other queued/in-progress/pending workflow runs were cancelled." >> "$GITHUB_STEP_SUMMARY"
          echo "- Fresh Desktop, Rust compatibility, Android and CodeQL validation was dispatched through the unified workflow." >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Build Android foundation and ARM64 bridge
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (
        needs.changes.outputs.build_reset != 'true' &&
        (
          (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
          (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'master'))
        )
      )
    permissions:
      contents: read
    concurrency:
      group: android-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
          packages: ''

      - name: Install Android build dependencies
        run: |
          # Use Google's current Android SDK CLI. The legacy sdkmanager emits
          # a deprecation warning from current command-line tool packages.
          set +o pipefail
          yes 2>/dev/null | android --no-metrics --sdk="$ANDROID_HOME" sdk install \
            platform-tools \
            platforms/android-37.0 \
            build-tools/36.0.0 \
            ndk/28.2.13676358 \
            cmake/3.22.1
          android_cli_exit=${PIPESTATUS[1]}
          set -o pipefail
          test "$android_cli_exit" -eq 0
          bash scripts/install-linux-build-deps.sh nasm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Rust with Android ARM64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/nova-mobile-ffi -> .build/android-rust
          key: android-arm64

      - name: Build and verify ARM64 Rust bridge
        run: |
          scripts/build-android-ffi.sh arm64-v8a
          test -f android/app/src/main/jniLibs/arm64-v8a/libnova_mobile_ffi.so

      - name: Test shared Rust download core and mobile bridge
        run: |
          cargo test --manifest-path crates/nova-download-core/Cargo.toml --features http2,rustls,static-curl
          cargo test --manifest-path crates/nova-mobile-core/Cargo.toml --features http2,rustls,static-curl
          cargo test --manifest-path crates/nova-mobile-ffi/Cargo.toml

      - name: Build debug APK and run JVM tests
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest

      - name: Verify APK packages the NOVA Rust core
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libnova_mobile_ffi.so'

      - name: Upload Android foundation outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-foundation-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  runtime-compatibility:
    name: Rust daemon compatibility
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (
        needs.changes.outputs.build_reset != 'true' &&
        (needs.changes.outputs.runtime == 'true' || needs.changes.outputs.release_request == 'true') &&
        (
          (
            github.event_name == 'push' &&
            (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
          ) ||
          (
            github.event_name == 'pull_request' &&
            (github.base_ref == 'main' || github.base_ref == 'master')
          )
        )
      )
    concurrency:
      group: runtime-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        run: |
          bash scripts/install-linux-build-deps.sh \
            libssl-dev \
            libcurl4-openssl-dev \
            libbrotli-dev \
            libzstd-dev \
            libnghttp2-dev \
            libssh2-1-dev \
            nasm \
            pkg-config

      - name: Build and activate verified native libcurl
        shell: bash
        run: |
          set -euo pipefail
          pnpm run native-curl:build
          source bin/native-curl.env
          pnpm run native-curl:verify
          for name in \
            NOVA_LIBCURL_PREFIX \
            NOVA_EXPECT_LIBCURL_VERSION \
            NOVA_EXPECT_LIBCURL_TAG \
            NOVA_EXPECT_LIBCURL_SHA256 \
            NOVA_EXPECT_LIBCURL_PROTOCOLS \
            NOVA_EXPECT_LIBCURL_FEATURES \
            NOVA_LIBCURL_FEATURE_PROFILE \
            NOVA_LIBCURL_LINK_MODE \
            PKG_CONFIG_PATH \
            PKG_CONFIG_ALL_STATIC \
            PKG_CONFIG_ALLOW_CROSS; do
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_ENV"
          done
          printf '%s\n' "$NOVA_LIBCURL_PREFIX/bin" >> "$GITHUB_PATH"

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Test every shared Rust core explicitly
        run: node scripts/run-shared-core-tests.mjs

      - name: Check native runtime binaries
        run: cargo check --manifest-path src-tauri/Cargo.toml --bin nova-native-backend --bin nova-native-host

      - name: T00 full Rust verification
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --lib
          cargo test --manifest-path crates/nova-core-model/Cargo.toml
          cargo test --manifest-path crates/nova-download-core/Cargo.toml
          cargo test --manifest-path crates/nova-mobile-core/Cargo.toml
          cargo test --manifest-path crates/nova-mobile-ffi/Cargo.toml
          cargo test --manifest-path crates/nova-stream-core/Cargo.toml
          cargo test --manifest-path crates/nova-media-core/Cargo.toml
          cargo test --manifest-path crates/nova-media-processing-core/Cargo.toml
          cargo test --manifest-path crates/nova-torrent-core/Cargo.toml
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          for manifest in \
            crates/nova-core-model/Cargo.toml \
            crates/nova-download-core/Cargo.toml \
            crates/nova-mobile-core/Cargo.toml \
            crates/nova-mobile-ffi/Cargo.toml \
            crates/nova-stream-core/Cargo.toml \
            crates/nova-media-core/Cargo.toml \
            crates/nova-media-processing-core/Cargo.toml \
            crates/nova-torrent-core/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" --check
            cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
          done

      - name: Native bootstrap and browser integration tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml native_desktop_data_dir_honors_explicit_override --lib
          cargo test --manifest-path src-tauri/Cargo.toml accepts_the_native_host_marker --lib
          cargo test --manifest-path src-tauri/Cargo.toml rejects_native_marker_when_a_browser_origin_is_present --lib
          cargo test --manifest-path src-tauri/Cargo.toml accepts_the_pinned_chromium_extension_origin --lib
          cargo test --manifest-path src-tauri/Cargo.toml extension_media_capabilities_do_not_require_postprocessing --lib
          cargo test --manifest-path src-tauri/Cargo.toml native_media_status_is_in_process_and_fail_closed --lib
          cargo test --manifest-path src-tauri/Cargo.toml restored_catalog_keeps_empty_custom_queues --lib
          cargo test --manifest-path src-tauri/Cargo.toml queue_normalization_clamps_limits_and_preserves_order --lib
          cargo test --manifest-path src-tauri/Cargo.toml queue_schedule_supports_custom_days_and_overnight_windows --lib
          cargo test --manifest-path src-tauri/Cargo.toml once_queue_stays_disabled_after_completion --lib
          cargo test --manifest-path src-tauri/Cargo.toml queue_runtime_edges_and_retry_delay_are_stateful --lib
          cargo test --manifest-path src-tauri/Cargo.toml queue_catalog_rejects_invalid_or_duplicate_ids --lib
          cargo test --manifest-path src-tauri/Cargo.toml queue_catalog_round_trips_on_disk --lib

      - name: Install browser-extension dependencies
        run: pnpm install --frozen-lockfile

      - name: Runtime capabilities contract
        run: node scripts/check-runtime-contract.mjs

      - name: Shared design token parity
        run: node scripts/generate-design-tokens.mjs --check

      - name: Control Plane parity inventory and completion gate
        run: node scripts/check-control-plane-parity.mjs

      - name: Browser Native Messaging identity contract
        run: node desktop-native/scripts/check-browser-native-contract.mjs

      - name: Browser pairing typecheck
        run: pnpm --filter nova-browser-extension typecheck

      - name: Browser pairing unit tests
        run: pnpm --filter nova-browser-extension test:unit

  desktop:
    name: Build native UI (${{ matrix.os }})
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (
        needs.changes.outputs.build_reset != 'true' &&
        (needs.changes.outputs.desktop == 'true' || needs.changes.outputs.release_request == 'true') &&
        (
          (
            github.event_name == 'push' &&
            (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
          ) ||
          (
            github.event_name == 'pull_request' &&
            (github.base_ref == 'main' || github.base_ref == 'master')
          )
        )
      )
    permissions:
      contents: read
    concurrency:
      group: desktop-${{ matrix.os }}-${{ matrix.arch }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            arch: x64
          - os: windows-11-vs2026-arm
            platform: Windows
            arch: arm64
          - os: ubuntu-26.04
            platform: Linux
            arch: x64
          - os: ubuntu-26.04-arm
            platform: Linux
            arch: arm64
          - os: macos-15
            platform: macOS
            arch: arm64
          - os: macos-15-intel
            platform: macOS
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm for native checks (Windows)
        if: runner.os == 'Windows'
        uses: pnpm/setup@v3
        with:
          version: 11.6.0
          dest: ${{ runner.temp }}/setup-pnpm
          install: false

      - name: Setup pnpm for native checks (Unix)
        if: runner.os != 'Windows'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 24 for native checks
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Rust backend build dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash scripts/install-linux-build-deps.sh \
            libssl-dev \
            libcurl4-openssl-dev \
            libbrotli-dev \
            libzstd-dev \
            libnghttp2-dev \
            libssh2-1-dev \
            nasm \
            pkg-config

      - name: Install NASM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install nasm
          nasm -v

      - name: Install NASM (Windows x64)
        if: runner.os == 'Windows' && matrix.arch == 'x64'
        run: |
          choco install nasm --yes --no-progress
          nasm -v

      - name: Build native Rust runtime
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --bin nova-native-backend --bin nova-native-host

      - name: Check localization gate
        run: node desktop-native/scripts/check-localization.mjs

      - name: Check English-Arabic release localization
        run: node desktop-native/scripts/check-release-localization.mjs

      - name: Check approved UI design contract
        run: node desktop-native/scripts/check-approved-ui.mjs

      - name: Check accessibility and typography
        run: node desktop-native/scripts/check-native-accessibility.mjs

      - name: Check native desktop runtime regressions
        run: node desktop-native/scripts/check-desktop-runtime-issues.mjs

      - name: Check WCAG contrast
        run: node desktop-native/scripts/check-native-contrast.mjs

      - name: Check product-copy branding
        run: node desktop-native/scripts/check-product-copy.mjs

      - name: Check native production-readiness manifest
        run: node desktop-native/scripts/check-parity.mjs

      - name: Run native aggregate checks
        run: pnpm run native:check

      - name: Confirm production parity gate remains closed
        run: node desktop-native/scripts/check-parity.mjs --expect-incomplete

      - name: Install Qt
        if: matrix.arch == 'x64' || runner.os == 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true

      - name: Install Qt (Linux ARM64)
        if: runner.os == 'Linux' && matrix.arch == 'arm64'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux_arm64
          arch: linux_gcc_arm64
          cache: true

      - name: Install Qt (Windows ARM64)
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows_arm64
          arch: win64_msvc2022_arm64
          cache: true

      - name: Configure
        if: runner.os != 'Windows' || matrix.arch != 'arm64'
        run: cmake -S desktop-native -B build/native -DCMAKE_BUILD_TYPE=Release -DNOVA_BUILD_TESTS=ON

      - name: Configure (Windows ARM64)
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        run: cmake -S desktop-native -B build/native -A ARM64 -DCMAKE_BUILD_TYPE=Release -DNOVA_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/native --config Release --parallel
      - name: Validate native architecture (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Get-PEMachine([string]$Path) {
            $bytes = [System.IO.File]::ReadAllBytes($Path)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            return [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          }
          $expected = if ("${{ matrix.arch }}" -eq "arm64") { 0xAA64 } else { 0x8664 }
          foreach ($binary in @(
            "build/native/Release/nova-native.exe",
            "src-tauri/target/release/nova-native-backend.exe",
            "src-tauri/target/release/nova-native-host.exe"
          )) {
            $actual = Get-PEMachine $binary
            if ($actual -ne $expected) { throw "$binary machine 0x$($actual.ToString('X4')) does not match expected ${{ matrix.arch }}" }
          }

      - name: Validate native architecture (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ matrix.arch }}'
          for binary in build/native/nova-native src-tauri/target/release/nova-native-backend src-tauri/target/release/nova-native-host; do
            description="$(file -b "$binary")"
            if [ "$expected" = "arm64" ]; then
              printf '%s' "$description" | grep -Eqi 'aarch64|ARM aarch64'
            else
              printf '%s' "$description" | grep -Eqi 'x86-64|x86_64'
            fi
          done

      - name: Validate native architecture (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ matrix.arch }}'
          app="$(find build/native -type d -name 'nova-native.app' -print -quit)"
          test -n "$app"
          qt_archs="$(lipo -archs "$app/Contents/MacOS/nova-native")"
          backend_archs="$(lipo -archs src-tauri/target/release/nova-native-backend)"
          host_archs="$(lipo -archs src-tauri/target/release/nova-native-host)"
          if [ "$expected" = "arm64" ]; then
            for archs in "$qt_archs" "$backend_archs" "$host_archs"; do printf '%s' "$archs" | grep -qw arm64; done
          else
            for archs in "$qt_archs" "$backend_archs" "$host_archs"; do printf '%s' "$archs" | grep -qw x86_64; done
          fi

      - name: Configure Visual Studio runtime discovery for Qt
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhereCandidates = @()
          if (${env:ProgramFiles(x86)}) { $vswhereCandidates += Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe' }
          if ($env:ProgramFiles) { $vswhereCandidates += Join-Path $env:ProgramFiles 'Microsoft Visual Studio\Installer\vswhere.exe' }
          $vswhere = $vswhereCandidates | Where-Object { Test-Path $_ -PathType Leaf } | Select-Object -First 1
          if (!$vswhere) { throw 'Visual Studio locator (vswhere.exe) was not found in either Program Files directory.' }
          $vsInstall = (& $vswhere -latest -products '*' -property installationPath | Select-Object -First 1).Trim()
          if (!$vsInstall) { throw 'Visual Studio installation could not be located for Qt deployment.' }
          $vcInstall = Join-Path $vsInstall 'VC'
          if (!(Test-Path $vcInstall -PathType Container)) { throw "Visual Studio C++ tools directory was not found: $vcInstall" }
          $env:VCINSTALLDIR = $vcInstall + [System.IO.Path]::DirectorySeparatorChar
          "VCINSTALLDIR=$env:VCINSTALLDIR" >> $env:GITHUB_ENV

      - name: Deploy Qt test runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The Windows runner does not ship an optional system DXC compiler;
          # skip probing for it because NOVA does not depend on that compiler.
          windeployqt --release --no-translations --no-system-dxc-compiler "build/native/Release/nova-native-tests.exe"
          windeployqt --release --no-translations --no-system-dxc-compiler "build/native/Release/nova-native-display-tests.exe"

      - name: Native stress and recovery tests
        run: ctest --test-dir build/native -C Release --output-on-failure

      - name: Diagnose native parity failure (Windows)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ctestLog = "build/native/Testing/Temporary/LastTest.log"
          if (Test-Path $ctestLog) {
            Write-Output "---- CTest LastTest.log ----"
            Get-Content $ctestLog -Tail 300
          }
          $qtTestLog = Join-Path $env:RUNNER_TEMP "nova-native-parity.txt"
          & "build/native/Release/nova-native-tests.exe" "-o" "$qtTestLog,txt" "-v2"
          $qtTestExitCode = $LASTEXITCODE
          Write-Output "QtTest native parity exit code: $qtTestExitCode"
          if (Test-Path $qtTestLog) {
            Write-Output "---- QtTest native parity output ----"
            Get-Content $qtTestLog
          }
          ctest --test-dir build/native -C Release --rerun-failed --verbose
          exit 0

      - name: Install preview bundle
        run: cmake --install build/native --config Release --prefix "preview/NOVA-Native-${{ runner.os }}"

      - name: Add Rust runtime to preview (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = "preview/NOVA-Native-Windows/bin"
          Copy-Item "src-tauri/target/release/nova-native-backend.exe" $bundle
          Copy-Item "src-tauri/target/release/nova-native-host.exe" $bundle
          if (!(Test-Path (Join-Path $bundle "nova-native-backend.exe"))) { throw "Native backend missing" }
          if (!(Test-Path (Join-Path $bundle "nova-native-host.exe"))) { throw "Native host missing" }

      - name: Add Rust runtime to preview (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bundle="preview/NOVA-Native-Linux/bin"
          cp src-tauri/target/release/nova-native-backend "$bundle/"
          cp src-tauri/target/release/nova-native-host "$bundle/"
          chmod 0755 "$bundle/nova-native-backend" "$bundle/nova-native-host"
          test -x "$bundle/nova-native-backend"
          test -x "$bundle/nova-native-host"

      - name: Prepare macOS native bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bundle="preview/NOVA-Native-macOS"
          app="$(find "$bundle" -type d -name '*.app' -print -quit)"
          test -n "$app"
          macos_bin="$app/Contents/MacOS"
          test -x "$macos_bin/nova-native"
          cp src-tauri/target/release/nova-native-backend "$macos_bin/"
          cp src-tauri/target/release/nova-native-host "$macos_bin/"
          chmod 0755 "$macos_bin/nova-native-backend" "$macos_bin/nova-native-host"
          if grep -R -n -E '(^|[[:space:]])import[[:space:]]+QtSql|(^|[[:space:]])import[[:space:]]+Qt\.sql|Qt6::Sql|Qt::Sql|QSql[A-Za-z]*' desktop-native/qml desktop-native/CMakeLists.txt; then
            echo "::error::The native desktop now uses Qt SQL; review SQL driver deployment before excluding unused drivers."
            exit 1
          fi
          qt_plugins="$(qmake -query QT_INSTALL_PLUGINS)"
          test -d "$qt_plugins"
          sql_plugins="$qt_plugins/sqldrivers"
          sql_plugins_stash="$RUNNER_TEMP/nova-unused-qt-sqldrivers"
          if [ -d "$sql_plugins" ]; then
            if [ -e "$sql_plugins_stash" ]; then
              echo "::error::The temporary Qt SQL plugin staging path already exists."
              exit 1
            fi
            mv "$sql_plugins" "$sql_plugins_stash"
          fi
          macdeployqt "$app" -qmldir=desktop-native/qml -appstore-compliant
          test -x "$macos_bin/nova-native-backend"
          test -x "$macos_bin/nova-native-host"

      - name: Deploy Qt runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = "preview/NOVA-Native-Windows"
          $exe = Join-Path $bundle "bin/nova-native.exe"
          # Match Qt deployment to the runner's installed C++ environment while
          # explicitly omitting the optional system DXC compiler.
          windeployqt --release --no-system-dxc-compiler --qmldir desktop-native/qml --dir (Join-Path $bundle "bin") $exe
          Copy-Item build/native-parity-report.md (Join-Path $bundle "PARITY_REPORT.md")
          @"
          NOVA Native Desktop
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
          Platform: Windows
          Architecture: ${{ matrix.arch }}
          Qt: 6.8.3
          UI: Qt 6 native production shell
          Runtime: Qt UI + Rust backend + Native Messaging host
          "@ | Set-Content (Join-Path $bundle "BUILD_INFO.txt")

      - name: Prepare macOS preview metadata
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bundle="preview/NOVA-Native-macOS"
          cp build/native-parity-report.md "$bundle/PARITY_REPORT.md"
          {
            echo "NOVA Native Desktop"
            echo "Commit: ${GITHUB_SHA}"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Platform: macOS"
            echo "Architecture: ${{ matrix.arch }}"
            echo "Qt: 6.8.3"
            echo "UI: Qt 6 native production shell"
            echo "Runtime: Qt UI + Rust backend + Native Messaging host"
          } > "$bundle/BUILD_INFO.txt"

      - name: Smoke-test native backend auto-pair (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          runtime="preview/NOVA-Native-Linux/bin"
          data_dir="$RUNNER_TEMP/nova-native-backend-smoke"
          mkdir -p "$data_dir"
          NOVA_NATIVE_DATA_DIR="$data_dir" NOVA_DAEMON_PORT=3299 "$runtime/nova-native-backend" &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 40); do
            response="$(curl -fsS -X POST \
              -H 'Content-Type: application/json' \
              -H 'x-nova-native-host: 1' \
              -d '{}' \
              http://127.0.0.1:3299/v1/pair/auto 2>/dev/null || true)"
            if printf '%s' "$response" | grep -q '"pairToken"'; then
              ready=1
              break
            fi
            sleep 0.25
          done
          test "$ready" -eq 1

      - name: Prepare Linux preview metadata
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bundle="preview/NOVA-Native-Linux"
          cp build/native-parity-report.md "$bundle/PARITY_REPORT.md"
          {
            echo "NOVA Native Desktop"
            echo "Commit: ${GITHUB_SHA}"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Platform: Linux"
            echo "Architecture: ${{ matrix.arch }}"
            echo "Qt: 6.8.3"
            echo "UI: Qt 6 native production shell"
            echo "Runtime: Qt UI + Rust backend + Native Messaging host"
          } > "$bundle/BUILD_INFO.txt"
          ldd "$bundle/bin/nova-native" > "$bundle/LINUX_RUNTIME_DEPENDENCIES.txt" || true

      - name: Smoke-test packaged Native Messaging bridge
        run: node desktop-native/scripts/smoke-native-messaging.mjs "preview/NOVA-Native-${{ runner.os }}"

      - name: Upload native preview
        uses: actions/upload-artifact@v6
        with:
          name: NOVA-Native-Preview-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: preview/NOVA-Native-${{ runner.os }}/
          if-no-files-found: error
          retention-days: 14

  codeql:
    name: Analyze ${{ matrix.language }}
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (
        needs.changes.outputs.build_reset != 'true' &&
        (
          (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
          (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'master'))
        )
      )
    permissions:
      contents: read
      security-events: write
    concurrency:
      group: codeql-${{ matrix.language }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none
          - language: java-kotlin
            build-mode: manual

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK command-line tools
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
          packages: ''

      - name: Install Android compile dependencies
        if: matrix.language == 'java-kotlin'
        run: |
          # Use Google's current Android SDK CLI. The legacy sdkmanager emits
          # a deprecation warning from current command-line tool packages.
          set +o pipefail
          yes 2>/dev/null | android --no-metrics --sdk="$ANDROID_HOME" sdk install \
            platform-tools \
            platforms/android-37.0 \
            build-tools/36.0.0
          android_cli_exit=${PIPESTATUS[1]}
          set -o pipefail
          test "$android_cli_exit" -eq 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          dependency-caching: true
        env:
          # Kotlin requires a traced manual build, which cannot produce the
          # overlay-base database. Disable overlay explicitly and analyze the
          # full build instead of emitting a fallback warning.
          CODEQL_OVERLAY_DATABASE_MODE: ${{ matrix.language == 'java-kotlin' && 'none' || '' }}

      - name: Build Kotlin for CodeQL
        if: matrix.language == 'java-kotlin'
        working-directory: android
        # CodeQL must observe a real Kotlin compiler process. A cached task
        # produces no traceable compilation and leaves the Java/Kotlin database empty.
        run: ./gradlew --no-daemon --no-build-cache --rerun-tasks :app:compileDebugKotlin

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  quality:
    name: Strict code and security quality gate
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (
        needs.changes.outputs.build_reset != 'true' &&
        (
          (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
          (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'master'))
        )
      )
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked quality tooling
        run: pnpm install --frozen-lockfile

      - name: Enforce repository security and architecture policy
        run: |
          pnpm run security:check
          pnpm run facts:verify
          pnpm run branding:verify

      - name: Enforce generated contracts and capability parity
        run: |
          node scripts/check-runtime-contract.mjs
          node scripts/generate-design-tokens.mjs --check
          node scripts/check-control-plane-parity.mjs
          node desktop-native/scripts/check-parity.mjs

      - name: Enforce native UI, localization, accessibility, and visual contracts
        run: pnpm run native:check

      - name: Enforce browser extension lint with zero warnings
        run: pnpm --filter nova-browser-extension exec eslint . --max-warnings 0

      - name: Build browser extension packages
        run: pnpm --filter nova-browser-extension build

      - name: Validate packaged browser manifests
        run: pnpm --filter nova-browser-extension validate:manifests

      - name: Reject whitespace defects in submitted source
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE_SHA" ]]; then
            git diff --check "$BASE_SHA...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi

  release:
    name: Create tag and draft release
    needs:
      - changes
      - quality
      - runtime-compatibility
      - android
      - desktop
      - codeql
      - windows-installer
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.release_request == 'true'
    permissions:
      actions: write
      contents: write
    concurrency:
      group: nova-release-request
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Read release request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.version // empty' .github/release-request.json)"
          NOTES="$(jq -r '.notes // empty' .github/release-request.json)"
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Invalid release version: $VERSION"
            exit 1
          fi
          if [ -z "$NOTES" ]; then
            echo "::error::Release notes must not be empty"
            exit 1
          fi
          printf '%s\n' "$NOTES" > /tmp/release-notes.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Enforce native production readiness
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.version // empty' .github/release-request.json)"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha(\.[0-9]+)?$ ]]; then
            echo "Creating an explicitly labeled alpha preview; production parity remains gated."
            node desktop-native/scripts/check-parity.mjs
          else
            node desktop-native/scripts/check-parity.mjs --require-complete
          fi

      - name: Ensure tag does not already exist
        env:
          TAG: ${{ steps.request.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

      - name: Stamp release version
        env:
          TAG: ${{ steps.request.outputs.tag }}
        run: node scripts/apply-version.mjs "$TAG"

      - name: Commit version bump
        env:
          VERSION: ${{ steps.request.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json desktop-native/CMakeLists.txt desktop-native/parity/parity-manifest.json src-tauri/Cargo.toml src-tauri/Cargo.lock android/app/build.gradle.kts browser-extension/package.json browser-extension/src/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: release v$VERSION"
            git push origin main
          fi

      - name: Create and push annotated tag
        env:
          TAG: ${{ steps.request.outputs.tag }}
        run: |
          set -euo pipefail
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create curated draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.request.outputs.tag }}
        run: |
          set -euo pipefail
          args=(release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Nova Download Manager $TAG" --notes-file /tmp/release-notes.md --draft)
          if [[ "$TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"

      - name: Dispatch full CI against the immutable release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.request.outputs.tag }}
        run: gh workflow run nova-ci.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"


      - name: Summary
        env:
          TAG: ${{ steps.request.outputs.tag }}
        run: |
          echo "## Release $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version sources stamped and committed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Annotated tag created and pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Curated draft GitHub Release created" >> "$GITHUB_STEP_SUMMARY"
          echo "- Required quality, Rust, Android, six-platform desktop, and Windows installer preflight passed before the tag was created" >> "$GITHUB_STEP_SUMMARY"
          echo "- Stable releases require complete native production parity; alpha previews retain the documented parity blockers" >> "$GITHUB_STEP_SUMMARY"
          echo "- Full CI was explicitly dispatched against the immutable tag; the final installer will be attached after those checks pass" >> "$GITHUB_STEP_SUMMARY"

  windows-installer:
    name: Build and smoke-check Windows setup (${{ matrix.arch }})
    needs:
      - changes
      - quality
      - runtime-compatibility
      - android
      - desktop
      - codeql
    if: >-
      always() &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) ||
        (
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          needs.changes.outputs.release_request == 'true'
        ) ||
        (
          (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
          (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'master'))
        ) && needs.changes.outputs.windows_installer == 'true'
      )
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Enforce upstream quality results
        shell: pwsh
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          RELEASE_RUN: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) || (github.event_name == 'push' && needs.changes.outputs.release_request == 'true') }}
        run: |
          $ErrorActionPreference = 'Stop'
          $jobs = $env:JOB_RESULTS | ConvertFrom-Json
          foreach ($required in @('changes', 'quality', 'desktop', 'codeql')) {
            $result = $jobs.PSObject.Properties[$required].Value.result
            if ($result -ne 'success') { throw "Required upstream quality job '$required' ended as '$result'" }
          }
          if ($env:RELEASE_RUN -eq 'true') {
            foreach ($required in @('runtime-compatibility', 'android')) {
              $result = $jobs.PSObject.Properties[$required].Value.result
              if ($result -ne 'success') { throw "Release requires '$required' to succeed, got '$result'" }
            }
          } else {
            foreach ($name in @('runtime-compatibility', 'android')) {
              $result = $jobs.PSObject.Properties[$name].Value.result
              if ($result -in @('failure', 'cancelled')) { throw "Upstream job '$name' ended as '$result'" }
            }
          }

      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download matching native Windows runtime bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ARCH: ${{ matrix.arch }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $artifact = "NOVA-Native-Preview-Windows-$env:ARCH-$env:COMMIT_SHA"
          $destination = "preview/NOVA-Native-Windows-$env:ARCH"
          gh run download $env:RUN_ID --repo $env:REPOSITORY --name $artifact --dir $destination
          if ($LASTEXITCODE -ne 0) { throw "Could not download matching native runtime artifact '$artifact'." }

      - name: Install pinned NSIS compiler
        shell: pwsh
        run: choco install nsis --version=3.12.0 --yes --no-progress

      - name: Resolve validated release version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($version)) {
            $request = Get-Content .github/release-request.json -Raw | ConvertFrom-Json
            $version = "v$($request.version)"
          }
          if ($version -notmatch '^v(?<major>0|[1-9]\d*)\.(?<minor>0|[1-9]\d*)\.(?<patch>0|[1-9]\d*)(?<suffix>-[0-9A-Za-z.-]+)?$') {
            throw "Invalid release version for setup: $version"
          }
          $appVersion = "$($Matches.major).$($Matches.minor).$($Matches.patch)$($Matches.suffix)"
          $compilerVersion = "$($Matches.major).$($Matches.minor).$($Matches.patch).0"
          "app_version=$appVersion" >> $env:GITHUB_OUTPUT
          "compiler_version=$compilerVersion" >> $env:GITHUB_OUTPUT

      - name: Compile versioned setup
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          APP_FILE_VERSION: ${{ steps.version.outputs.compiler_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $appSource = "preview\NOVA-Native-Windows-${{ matrix.arch }}"
          $installerPath = "dist\NOVA-Download-Manager-Setup-$env:APP_VERSION-${{ matrix.arch }}.exe"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $compilerCommand = Get-Command makensis.exe -ErrorAction SilentlyContinue
          $compilerCandidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'),
            (Join-Path $env:ProgramFiles 'NSIS\makensis.exe'),
            $compilerCommand.Source
          )
          $compiler = $compilerCandidates |
            Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) } |
            Select-Object -First 1
          if (!$compiler) { throw 'Pinned NSIS installation did not expose makensis.exe in a known install path or PATH.' }
          & $compiler "/DAPP_VERSION=$env:APP_VERSION" "/DAPP_FILE_VERSION=$env:APP_FILE_VERSION" "/DAPP_ARCH=${{ matrix.arch }}" "/DAPP_SOURCE_DIR=$appSource" /NOCD "packaging\windows\nova-setup.nsi"
          if ($LASTEXITCODE -ne 0) { throw "NSIS setup compilation failed with exit code $LASTEXITCODE" }
          if (!(Test-Path $installerPath)) { throw "Expected installer was not created: $installerPath" }
          Write-Output "Built unsigned setup: $installerPath"

      - name: Install and uninstall smoke check
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path "dist\NOVA-Download-Manager-Setup-$env:APP_VERSION-${{ matrix.arch }}.exe").Path
          $installRoot = Join-Path $env:RUNNER_TEMP "nova-setup-smoke-${{ matrix.arch }}"
          $installProcess = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installRoot") -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) { throw "Silent installation failed with exit code $($installProcess.ExitCode)" }
          foreach ($relative in @('bin\nova-native.exe', 'bin\nova-native-backend.exe', 'bin\nova-native-host.exe', 'Uninstall.exe')) {
            if (!(Test-Path (Join-Path $installRoot $relative))) { throw "Installed runtime is missing: $relative" }
          }
          $uninstallProcess = Start-Process -FilePath (Join-Path $installRoot 'Uninstall.exe') -ArgumentList '/S' -Wait -PassThru
          if ($uninstallProcess.ExitCode -ne 0) { throw "Silent uninstall failed with exit code $($uninstallProcess.ExitCode)" }
          if (Test-Path $installRoot) { throw "Uninstaller left files behind at $installRoot" }

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -Filter 'NOVA-Download-Manager-Setup-*.exe' | Sort-Object Name
          if ($files.Count -ne 1) { throw "Expected exactly one setup for ${{ matrix.arch }}, found $($files.Count)" }
          $line = "$( (Get-FileHash $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() )  $($files[0].Name)"
          Set-Content -Path dist\SHA256SUMS-${{ matrix.arch }}.txt -Value $line -Encoding ascii

      - name: Upload versioned Windows setup
        uses: actions/upload-artifact@v7
        with:
          name: NOVA-Windows-Setup-${{ github.ref_type == 'tag' && github.ref_name || format('preflight-{0}', github.run_id) }}-${{ matrix.arch }}
          path: |
            dist/NOVA-Download-Manager-Setup-*.exe
            dist/SHA256SUMS-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 30

  publish-windows-installer:
    name: Attach Windows setup to tagged release
    needs: windows-installer
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))
    permissions:
      actions: read
      contents: write
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Download x64 and ARM64 setup artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          foreach ($arch in @('x64', 'arm64')) {
            $artifact = "NOVA-Windows-Setup-$env:RELEASE_TAG-$arch"
            gh run download $env:RELEASE_RUN_ID --repo $env:REPOSITORY --name $artifact --dir release-assets
            if ($LASTEXITCODE -ne 0) { throw "Could not download Windows setup artifact '$artifact'." }
          }

      - name: Attach installers and checksums to the GitHub draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem release-assets -Filter 'NOVA-Download-Manager-Setup-*.exe' | Sort-Object Name)
          $checksums = @(Get-ChildItem release-assets -Filter 'SHA256SUMS-*.txt' | Sort-Object Name)
          if ($installers.Count -ne 2 -or $checksums.Count -ne 2) { throw "Expected x64 and ARM64 installer/checksum pairs" }
          $release = & gh release view $env:RELEASE_TAG --repo $env:REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            & gh release create $env:RELEASE_TAG --repo $env:REPOSITORY --title "NOVA Download Manager $env:RELEASE_TAG" --generate-notes --draft --verify-tag
            if ($LASTEXITCODE -ne 0) { throw "Could not create draft release for $env:RELEASE_TAG" }
          }
          & gh release upload $env:RELEASE_TAG @($installers.FullName) @($checksums.FullName) --repo $env:REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not attach Windows installers to $env:RELEASE_TAG" }

      - name: Summarize downloadable Windows installers
        run: |
          echo "## Windows setup artifacts for ${{ github.ref_name }}" >> $env:GITHUB_STEP_SUMMARY
          echo "- x64 and ARM64 per-user installers passed install/uninstall smoke checks." >> $env:GITHUB_STEP_SUMMARY
          echo "- SHA-256 files are attached to the draft release." >> $env:GITHUB_STEP_SUMMARY
